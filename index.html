        margin-bottom: 30px;
      }

      .social-icon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
        text-decoration: none;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .social-icon:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .instagram {
        background: linear-gradient(
          45deg,
          #f09433 0%,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%

      .whatsapp {

      .youtube {

      .tiktok {

      .links-section {

        margin-bottom: 30px;
      }

        background: white;
        border: 2px solid #5aab9e;

        text-decoration: none;
        text-align: center;
        font-weight: 600;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .link-button:hover {
        background: #5aab9e;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(90, 171, 158, 0.4);
